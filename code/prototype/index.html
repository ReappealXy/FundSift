<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#203e5f">
  <title>东启勘流 · 案件工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23203e5f'/%3E%3Cpath d='M8 9h6v14H8m10-14h6v14h-6M8 16h16' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script defer src="icons.js"></script>
  <script defer src="data.js"></script>
  <script defer src="exporter.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至工作区</a>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="主导航"></aside>
    <div class="main-shell">
      <header id="topbar" class="topbar"></header>
      <main id="main" class="workspace" tabindex="-1"></main>
      <footer id="statusbar" class="statusbar"></footer>
    </div>
  </div>
  <div id="inspector"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-stack" aria-live="polite"></div>
  <input id="file-picker" type="file" accept=".xlsx,.xls,.csv,.txt" multiple hidden>
  <noscript>请启用 JavaScript 以使用交互原型。</noscript>
</body>
</html>
