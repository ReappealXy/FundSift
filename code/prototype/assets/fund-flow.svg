<svg xmlns="http://www.w3.org/2000/svg" width="820" height="660" viewBox="0 0 820 660" role="img" aria-labelledby="art-title art-desc">
  <title id="art-title">资金流水汇聚与核验轨迹</title>
  <desc id="art-desc">银行、微信和支付宝三路流水沿冰蓝色轨迹汇聚到分层账页核心，再连接金额核验与来源定位节点。纯示意图，不包含真实案件信息。</desc>
  <defs>
    <radialGradient id="halo">
      <stop stop-color="#8dceef" stop-opacity=".2"/>
      <stop offset=".48" stop-color="#b1dff5" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fcff"/>
      <stop offset="1" stop-color="#d9edf9"/>
    </linearGradient>
    <linearGradient id="top" x1=".1" y1="0" x2=".75" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset=".4" stop-color="#f3faff"/>
      <stop offset="1" stop-color="#dceffb"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2=".5">
      <stop stop-color="#2b8ecb" stop-opacity=".08"/>
      <stop offset=".52" stop-color="#1670b8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#2b8ecb" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8ab8d4" stop-opacity=".22"/>
      <stop offset=".7" stop-color="#2b8ecb" stop-opacity=".65"/>
      <stop offset="1" stop-color="#1670b8" stop-opacity=".32"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eff8fd"/>
    </linearGradient>
    <filter id="soft-glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="core-shadow" x="-40%" y="-40%" width="180%" height="220%">
      <feDropShadow dx="0" dy="18" stdDeviation="17" flood-color="#2b6b95" flood-opacity=".14"/>
    </filter>
    <path id="bank-route" d="M205 192H239C273 192 276 260 310 278L353 302"/>
    <path id="wechat-route" d="M172 335H253C286 335 296 324 333 324H355"/>
    <path id="alipay-route" d="M205 474H237C273 474 284 403 318 384L363 358"/>
    <path id="verify-route" d="M535 286L589 255C609 243 611 215 637 215H656"/>
    <path id="source-route" d="M547 355L592 381C613 394 615 429 641 429H666"/>
  </defs>
  <style>
    text{font-family:"DengXian","等线","Noto Sans SC","Microsoft YaHei UI","Segoe UI",sans-serif}
    .guide{fill:none;stroke:#77a7c7;stroke-opacity:.16;stroke-width:1}
    .trace{fill:none;stroke:url(#route);stroke-width:1.45;stroke-linecap:round}
    .signal{fill:none;stroke:#1670b8;stroke-width:2;stroke-linecap:round;stroke-dasharray:5 285;animation:travel 7s linear infinite;opacity:.85}
    .signal-b{animation-delay:-2.4s;animation-duration:8.4s}
    .signal-c{animation-delay:-4.7s;animation-duration:9s}
    .signal-d{animation-delay:-1.1s;animation-duration:6.3s;stroke-dasharray:4 225;stroke:#2798a3}
    .signal-e{animation-delay:-3.2s;animation-duration:7.5s;stroke-dasharray:4 225}
    .node-label{fill:#15354b;font-size:14px;letter-spacing:.5px}
    .node-sub{fill:#5d7285;font-size:10px}
    .small-label{fill:#5d7285;font-size:11px;letter-spacing:1px}
    .core-label{fill:#15354b;font-size:15px;letter-spacing:3px}
    @keyframes travel{from{stroke-dashoffset:290}to{stroke-dashoffset:0}}
    @media(prefers-reduced-motion:reduce){.signal{animation:none;stroke-dasharray:none;stroke-width:1;opacity:.2}}
  </style>

  <ellipse cx="443" cy="326" rx="337" ry="291" fill="url(#halo)"/>

  <!-- Quiet reference plane gives the account routes a sense of depth. -->
  <g class="guide">
    <path d="M156 476 440 314 734 482 450 644Z"/>
    <path d="M210 507 494 345M268 540 552 378M326 573 610 411M384 607 668 445"/>
    <path d="M213 443 507 611M270 411 564 578M327 378 621 546M384 346 678 513"/>
    <path d="M287 425 443 337 600 427 445 516Z" stroke-opacity=".17"/>
  </g>
  <g fill="none" stroke="#8db9d4" stroke-opacity=".15">
    <ellipse cx="444" cy="355" rx="209" ry="119"/>
    <path d="M268 290A209 119 0 0 1 530 247M620 419A209 119 0 0 1 352 464" stroke="#5b9cc5" stroke-opacity=".4"/>
    <ellipse cx="444" cy="355" rx="227" ry="130" stroke-dasharray="2 13"/>
  </g>

  <!-- Distinct channels join the same ledger core. -->
  <g class="trace">
    <use href="#bank-route"/>
    <use href="#wechat-route"/>
    <use href="#alipay-route"/>
    <use href="#verify-route"/>
    <use href="#source-route"/>
  </g>
  <g stroke="#8db9d4" stroke-opacity=".15" fill="none">
    <path d="M205 202H235C266 202 269 269 305 290L347 314"/>
    <path d="M205 464H235C266 464 276 394 311 373L355 348"/>
    <path d="M552 364 587 385C608 399 608 439 640 439H666"/>
  </g>
  <use href="#bank-route" class="signal"/>
  <use href="#wechat-route" class="signal signal-b"/>
  <use href="#alipay-route" class="signal signal-c"/>
  <use href="#verify-route" class="signal signal-d"/>
  <use href="#source-route" class="signal signal-e"/>

  <!-- White-glass ledger sheets: blue side faces preserve depth on a bright page. -->
  <g filter="url(#core-shadow)">
    <path d="M316 354 440 283 573 360 449 432Z" fill="url(#plate)" stroke="#8fbbd7" stroke-opacity=".48"/>
    <path d="M316 354v11l133 77 124-72v-10l-124 72Z" fill="#c5e2f4" stroke="#7db0d1" stroke-opacity=".5"/>
    <path d="M316 334 440 263 573 340 449 412Z" fill="url(#plate)" stroke="#83b5d3" stroke-opacity=".58"/>
    <path d="M316 334v10l133 77 124-72v-9l-124 72Z" fill="#cce7f7" stroke="#87b8d6" stroke-opacity=".45"/>
    <path d="M316 314 440 243 573 320 449 392Z" fill="url(#plate)" stroke="#72acd0" stroke-opacity=".65"/>
    <path d="M316 314v10l133 77 124-72v-9l-124 72Z" fill="#d7edf9" stroke="#72a7ca" stroke-opacity=".5"/>
    <path d="M316 293 440 222 573 299 449 371Z" fill="url(#top)" stroke="#79accf" stroke-opacity=".72"/>
    <path d="M316 293v11l133 77 124-72v-10l-124 72Z" fill="#cce5f5" stroke="#6ba0c7" stroke-opacity=".7"/>
  </g>
  <path d="M317 293 449 370 573 299" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <path d="M319 294 449 369 569 300" fill="none" stroke="#2992ce" stroke-width="5" opacity=".23" filter="url(#soft-glow)"/>

  <!-- Columns on the top plane express statements becoming a single table. -->
  <g transform="matrix(.866 .5 -.866 .5 441 241)">
    <rect width="125" height="113" rx="3" fill="#ffffff" fill-opacity=".72" stroke="#7baccc" stroke-opacity=".5"/>
    <path d="M0 25h125M0 47h125M0 69h125M0 91h125M27 0v113M88 0v113" fill="none" stroke="#7baccc" stroke-opacity=".4"/>
    <path d="M9 12h10M37 12h36M98 12h17" fill="none" stroke="#1d6eaa" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/>
    <g fill="#418cb9" fill-opacity=".75">
      <rect x="10" y="34" width="8" height="3" rx="1"/><rect x="37" y="34" width="35" height="3" rx="1"/><rect x="99" y="34" width="16" height="3" rx="1"/>
      <rect x="10" y="56" width="8" height="3" rx="1"/><rect x="37" y="56" width="25" height="3" rx="1"/><rect x="99" y="56" width="16" height="3" rx="1"/>
      <rect x="10" y="78" width="8" height="3" rx="1"/><rect x="37" y="78" width="31" height="3" rx="1"/><rect x="99" y="78" width="16" height="3" rx="1"/>
      <rect x="10" y="100" width="8" height="3" rx="1"/><rect x="37" y="100" width="22" height="3" rx="1"/><rect x="99" y="100" width="16" height="3" rx="1"/>
    </g>
    <path d="M92 69h32v22H92Z" fill="#49aab9" fill-opacity=".13"/>
    <path d="m100 79 4 4 9-9" fill="none" stroke="#258894" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="#1670b8">
    <circle cx="316" cy="293" r="2.4"/><circle cx="449" cy="371" r="2.4"/><circle cx="573" cy="299" r="2.4"/>
  </g>
  <g stroke="#6ba7cd" fill="none" stroke-opacity=".35">
    <path d="M449 432v37M433 478h32"/>
    <circle cx="449" cy="478" r="3" fill="#ffffff"/>
  </g>
  <text x="449" y="512" class="core-label" text-anchor="middle">流水并表</text>
  <text x="449" y="536" class="small-label" text-anchor="middle">来源各异，脉络相连</text>

  <!-- Bank statement input. -->
  <g transform="translate(64 156)">
    <rect width="141" height="73" rx="10" fill="url(#node)" stroke="#98bfd9" stroke-opacity=".8"/>
    <path d="M14 0h36M0 14v20" fill="none" stroke="#4b92be" stroke-opacity=".65"/>
    <rect x="15" y="18" width="34" height="36" rx="5" fill="#e0f0fa"/>
    <g transform="translate(22 25)" fill="none" stroke="#267db6" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="m0 6 10-5 10 5v2H0Zm2 13h16M0 22h20M4 10v7m6-7v7m6-7v7"/>
    </g>
    <text x="61" y="33" class="node-label">银行流水</text><text x="61" y="51" class="node-sub">账户收付明细</text>
    <circle cx="141" cy="36" r="3" fill="#2b8ecb"/>
  </g>
  <!-- Mobile-payment channels remain visually in the same system. -->
  <g transform="translate(31 299)">
    <rect width="141" height="73" rx="10" fill="url(#node)" stroke="#98bfd9" stroke-opacity=".8"/>
    <rect x="15" y="18" width="34" height="36" rx="5" fill="#e0f0fa"/>
    <g transform="translate(22 26)" fill="none" stroke="#267db6" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 7V4H3a3 3 0 0 0-3 3v12h20V9H3a2 2 0 0 1 0-4M14 10h6v5h-6Z"/>
      <circle cx="16.5" cy="12.5" r=".7" fill="#267db6" stroke="none"/>
    </g>
    <text x="61" y="33" class="node-label">微信支付</text><text x="61" y="51" class="node-sub">交易往来记录</text>
    <circle cx="141" cy="36" r="3" fill="#2b8ecb"/>
  </g>
  <g transform="translate(64 438)">
    <rect width="141" height="73" rx="10" fill="url(#node)" stroke="#98bfd9" stroke-opacity=".8"/>
    <path d="M0 40v19a14 14 0 0 0 14 14h20" fill="none" stroke="#4b92be" stroke-opacity=".45"/>
    <rect x="15" y="18" width="34" height="36" rx="5" fill="#e0f0fa"/>
    <g transform="translate(22 26)" fill="none" stroke="#267db6" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="2" width="20" height="17" rx="2"/><path d="M0 7h20M4 12h5m-5 3h9"/>
    </g>
    <text x="61" y="33" class="node-label">支付宝</text><text x="61" y="51" class="node-sub">账户交易明细</text>
    <circle cx="141" cy="36" r="3" fill="#2b8ecb"/>
  </g>

  <!-- Downstream verification and provenance. -->
  <g transform="translate(656 182)">
    <rect width="131" height="66" rx="10" fill="url(#node)" stroke="#8bbdc6" stroke-opacity=".52"/>
    <g transform="translate(16 20)" fill="none" stroke="#258894" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m12 0 10 4v8c0 6-5 10-10 13C7 22 2 18 2 12V4Z"/>
      <path d="m7 12 4 4 7-8"/>
    </g>
    <text x="55" y="29" class="node-label">金额核验</text><text x="55" y="47" class="node-sub">保留判断依据</text>
    <circle cy="33" r="3" fill="#258894"/>
  </g>
  <g transform="translate(666 396)">
    <rect width="131" height="66" rx="10" fill="url(#node)" stroke="#98bfd9" stroke-opacity=".5"/>
    <g transform="translate(18 20)" fill="none" stroke="#267db6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 0h13l6 6v17H2ZM14 0v7h7M6 11h10M6 15h8"/>
      <path d="m10 20 3 3 7-7" stroke="#2b8ecb"/>
    </g>
    <text x="55" y="29" class="node-label">来源定位</text><text x="55" y="47" class="node-sub">逐笔回看原值</text>
    <circle cy="33" r="3" fill="#2b8ecb"/>
  </g>

  <g fill="#7daaca" opacity=".42">
    <circle cx="240" cy="116" r="1.5"/><circle cx="620" cy="139" r="1.5"/><circle cx="701" cy="540" r="1.5"/>
    <path d="M256 129h9v1h-9m4-4h1v9h-1M611 550h9v1h-9m4-4h1v9h-1"/>
  </g>
  <path d="M300 102h43M300 102v12M684 575h43v-12" fill="none" stroke="#7daaca" stroke-opacity=".34"/>
  <text x="348" y="106" fill="#5d7285" font-size="10" letter-spacing="1">资金轨迹示意</text>
</svg>
